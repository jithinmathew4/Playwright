<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task Manager</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; color: #1f2328; }
    form { display: flex; gap: 8px; margin-bottom: 8px; }
    input[type="text"] { flex: 1; padding: 8px; font-size: 1rem; }
    button { padding: 8px 12px; font-size: 1rem; cursor: pointer; }
    ul { list-style: none; padding: 0; }
    li { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid #d0d7de; }
    li label { flex: 1; }
    li.done label { text-decoration: line-through; color: #656d76; }
    .error { color: #cf222e; min-height: 1.5em; margin: 0; }
    .status { color: #656d76; }
    .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  </style>
</head>
<body>
  <h1>Task Manager</h1>

  <form id="task-form" novalidate>
    <label for="new-task" class="visually-hidden">New task</label>
    <input id="new-task" type="text" placeholder="What needs doing?" autocomplete="off">
    <button type="submit">Add task</button>
  </form>
  <p id="form-error" class="error" role="alert"></p>

  <p id="status" class="status" role="status">Loading tasks…</p>
  <ul id="task-list" aria-label="Tasks"></ul>

  <script src="app.js"></script>
</body>
</html>
